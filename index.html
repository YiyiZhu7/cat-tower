<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>貓咪疊疊樂</title>
<style>
  :root {
    --ink: #2d2a32;
    --paper: #fffaf0;
    --accent: #ff7a59;
    --gold: #ffc94a;
    --font: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9fd6ee; color: var(--ink);
    font-family: var(--font); touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  canvas#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  button { font: inherit; font-weight: 800; color: var(--ink); background: var(--paper); border: 3px solid var(--ink);
    border-radius: 12px; padding: 6px 14px; box-shadow: 3px 3px 0 var(--ink); cursor: pointer; }
  button:active { transform: translate(3px,3px); box-shadow: none; }
  button.big { font-size: 20px; padding: 10px 22px; background: var(--accent); color: #fff; }

  /* 上方資訊列 */
  #hud { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: flex-start;
    padding: calc(10px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px));
    pointer-events: none; }
  .chip { background: var(--paper); border: 3px solid var(--ink); border-radius: 12px; padding: 4px 10px; box-shadow: 3px 3px 0 var(--ink);
    font-weight: 800; pointer-events: auto; }
  #score { font-size: 24px; font-variant-numeric: tabular-nums; text-align: right; line-height: 1.1; }
  #score small { display: block; font-size: 12px; font-weight: 600; }
  #left { display: flex; gap: 8px; align-items: center; }
  #soundBtn { font-size: 13px; padding: 3px 8px; pointer-events: auto; }

  /* 雜物選單 */
  #menu { position: fixed; left: 50%; top: calc(76px + env(safe-area-inset-top, 0px)); display: flex; gap: 8px;
    transform: translate(-50%, -300px); transition: transform .35s cubic-bezier(.3,1.4,.5,1); }
  #menu.on { transform: translate(-50%, 0); }
  .slot { width: 62px; height: 62px; border: 3px solid var(--ink); border-radius: 14px; background: rgba(255,250,240,.92);
    box-shadow: 3px 3px 0 var(--ink); cursor: grab; touch-action: none; display: flex; align-items: center; justify-content: center; }
  .slot canvas { width: 56px; height: 56px; pointer-events: none; }
  .slot.cat { background: #ffe7c7; }
  .slot.done { visibility: hidden; }
  @media (max-width: 400px) { #menu { gap: 5px; } .slot { width: 56px; height: 56px; } .slot canvas { width: 50px; height: 50px; } }

  #help { position: fixed; left: 50%; top: calc(158px + env(safe-area-inset-top, 0px)); transform: translateX(-50%);
    background: var(--ink); color: var(--paper); font-weight: 700; padding: 6px 14px; border-radius: 999px; white-space: nowrap;
    opacity: 0; transition: opacity .3s; pointer-events: none; font-size: 15px; }
  #help.on { opacity: 1; }
  #banner { position: fixed; left: 50%; top: 42%; transform: translate(-50%,-50%) scale(.6); font-size: 46px; font-weight: 900;
    color: #fff; -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 4px 4px 0 var(--ink);
    opacity: 0; transition: all .35s cubic-bezier(.3,1.6,.5,1); pointer-events: none; white-space: nowrap; }
  #banner.on { opacity: 1; transform: translate(-50%,-50%) scale(1); }

  /* 開始 / 結算畫面 */
  .overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); }
  .overlay.on { display: flex; }
  .card { background: var(--paper); border: 4px solid var(--ink); border-radius: 22px; box-shadow: 7px 7px 0 var(--ink);
    padding: 22px 26px; text-align: center; width: min(360px, 100%); }
  .card h1 { margin: 0; font-size: 40px; font-weight: 900; color: var(--accent); -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; }
  .card p { margin: 8px 0; }
  .card ol { text-align: left; margin: 12px 0 18px; padding-left: 22px; line-height: 1.7; }
  #resHeight { font-size: 48px; font-weight: 900; font-variant-numeric: tabular-nums; }
  #resStars { font-size: 30px; letter-spacing: 3px; color: var(--gold); -webkit-text-stroke: 1.5px var(--ink); }
  #resRating { font-weight: 800; font-size: 18px; }
  #resBest.new { color: var(--accent); font-weight: 900; }
  .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
  #closeView { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); display: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div id="left">
    <div class="chip" id="stageChip">第 1 關</div>
    <button id="soundBtn">聲音：開</button>
  </div>
  <div class="chip" id="score">0.00 m<small id="bestLine">最佳 0.00 m</small></div>
</div>
<div id="menu"></div>
<div id="help"></div>
<div id="banner"></div>

<div class="overlay on" id="intro">
  <div class="card">
    <h1>貓咪疊疊樂</h1>
    <p>貓咪最怕水了！用雜物蓋一座高塔，<br>讓牠們離池塘越遠越好。</p>
    <ol>
      <li>從上面把雜物拖到木台上</li>
      <li>每關的雜物都疊上去</li>
      <li>最後放上貓咪，量牠坐多高</li>
      <li>任何東西掉進水裡，遊戲就結束</li>
    </ol>
    <button class="big" id="startBtn">開始蓋塔</button>
    <p id="introBest" style="font-size:13px;margin-top:12px"></p>
  </div>
</div>

<div class="overlay" id="result">
  <div class="card">
    <div>貓咪最高坐到</div>
    <div id="resHeight">0.00 m</div>
    <div id="resStars"></div>
    <div id="resRating"></div>
    <p id="resBest"></p>
    <div class="row">
      <button class="big" id="againBtn">再玩一次</button>
      <button id="viewBtn">看我的塔</button>
    </div>
  </div>
</div>
<button id="closeView">關閉</button>

<script src="https://cdn.jsdelivr.net/npm/planck@1.4.2/dist/planck.min.js"></script>
<script>
'use strict';
const pl = planck;
const V = (x, y) => new pl.Vec2(x, y);
const $ = id => document.getElementById(id);

// ================= 1. 世界常數（單位：公尺，y 軸朝上） =================
const GRAVITY = -25;     // 重力調強，東西掉得比較乾脆
const PLAT_HW = 1.75;    // 木台半寬
const PLAT_TOP = 0;      // 木台頂面高度
const WATER = -0.6;      // 水面高度：碰到就輸
const CAM_MIN = -2.3;    // 鏡頭最低能看到哪裡
const INK = '#2d2a32';
const LW = 0.045;        // 物品描邊粗細

// ================= 2. 物品 =================
// parts：物理形狀（可以多塊拼成一個，例如椅子）
const box = (w, h, cx = 0, cy = 0) => ({ box: [w / 2, h / 2, cx, cy] });
const poly = pts => ({ poly: pts });
const circ = r => ({ circle: r });
const trap = (bw, tw, h) => poly([[-bw / 2, -h / 2], [bw / 2, -h / 2], [tw / 2, h / 2], [-tw / 2, h / 2]]);
const octa = (w, h, c) => poly([[-w/2+c,-h/2],[w/2-c,-h/2],[w/2,-h/2+c],[w/2,h/2-c],[w/2-c,h/2],[-w/2+c,h/2],[-w/2,h/2-c],[-w/2,-h/2+c]]);
const line = (c, x1, y1, x2, y2) => { c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke(); };
const dot = (c, x, y, r, col) => { c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fillStyle = col; c.fill(); };

// 編號規則（關卡會用到）：0 = 貓咪，1–2 = 長板子，3–6 = 一般雜物，7–14 = 怪東西
const TYPES = [
  { name: '貓咪', parts: [poly([[-.56,-.33],[.56,-.33],[.6,.02],[.44,.33],[-.44,.33],[-.6,.02]])], dens: .7, rest: .3, fric: .6, mat: 'cat' },
  { name: '木棧板', parts: [box(2.4, .36)], dens: 1, rest: .2, fric: .6, mat: 'wood', color: '#c9955b',
    deco: c => { c.fillStyle = '#e2b47a'; c.fillRect(-1.2, .04, 2.4, .14); c.fillStyle = '#8a5a2e';
      for (const x of [-1.05, -.15, .75]) c.fillRect(x, -.18, .3, .2);
      c.strokeStyle = 'rgba(45,42,50,.35)'; c.lineWidth = .025; for (const x of [-.6, 0, .6]) line(c, x, .04, x, .18); } },
  { name: '舊門板', parts: [box(2.2, .44)], dens: 1.1, rest: .2, fric: .55, mat: 'wood', color: '#7fb3a8',
    deco: c => { c.strokeStyle = 'rgba(45,42,50,.4)'; c.lineWidth = .035; c.strokeRect(-.95, -.12, .8, .24); c.strokeRect(-.05, -.12, .8, .24);
      dot(c, .88, 0, .06, '#f5c94c'); } },
  { name: '紙箱', parts: [box(1.3, .85)], dens: .7, rest: .2, fric: .45, mat: 'cardboard', color: '#d39b5f',
    deco: c => { c.fillStyle = '#ecc795'; c.fillRect(-.12, -.43, .24, .86); c.strokeStyle = 'rgba(45,42,50,.5)'; c.lineWidth = .04;
      for (const x of [-.42, -.28]) { line(c, x, -.15, x, .12); line(c, x - .06, .05, x, .12); line(c, x + .06, .05, x, .12); } } },
  { name: '木箱', parts: [box(1.1, 1.1)], dens: 1.1, rest: .2, fric: .5, mat: 'wood', color: '#b07a42',
    deco: c => { c.strokeStyle = '#7d5129'; c.lineWidth = .1; c.strokeRect(-.44, -.44, .88, .88); line(c, -.44, -.44, .44, .44); } },
  { name: '油漆桶', parts: [box(.9, 1.2)], dens: 1, rest: .15, fric: .3, mat: 'metal', color: '#d9dde3',
    deco: c => { c.fillStyle = '#e85d75'; c.fillRect(-.45, .2, .9, .4);
      for (const [x, h] of [[-.25, .22], [.05, .34], [.3, .15]]) { c.fillRect(x - .05, .2 - h, .1, h); dot(c, x, .2 - h, .06, '#e85d75'); }
      c.fillStyle = '#a9b0b8'; c.fillRect(-.45, .5, .9, .1); c.fillStyle = '#fffaf0'; c.fillRect(-.28, -.42, .56, .3); } },
  { name: '塑膠桶', parts: [octa(.95, 1.4, .16)], dens: 1, rest: .2, fric: .25, mat: 'plastic', color: '#3d8fd1',
    deco: c => { c.strokeStyle = '#2b6fa6'; c.lineWidth = .07; for (const y of [-.38, .38]) line(c, -.5, y, .5, y); c.fillStyle = '#2b6fa6'; c.fillRect(-.14, .62, .28, .1); } },
  { name: '花盆', parts: [trap(.66, .96, .85)], dens: 1, rest: .15, fric: .5, mat: 'ceramic', color: '#d8734a',
    deco: c => { c.fillStyle = '#b85a35'; c.fillRect(-.5, .25, 1, .18); },
    over: c => { c.strokeStyle = INK; c.lineWidth = LW;
      for (const [x, y, a] of [[-.22, .78, .6], [.2, .82, -.6], [0, .98, 0]]) {
        c.save(); c.translate(x, y); c.rotate(a); c.beginPath(); c.ellipse(0, 0, .11, .24, 0, 0, Math.PI * 2);
        c.fillStyle = '#5fae5a'; c.fill(); c.stroke(); c.restore(); } } },
  { name: '洗衣機', parts: [box(1.3, 1.45)], dens: 1, rest: .1, fric: .4, mat: 'metal', color: '#f4f5f7',
    deco: c => { c.fillStyle = '#d9dde3'; c.fillRect(-.65, .5, 1.3, .23); dot(c, .4, .61, .07, '#ff7a59');
      c.beginPath(); c.arc(0, -.12, .44, 0, 7); c.fillStyle = '#c7ccd3'; c.fill(); c.strokeStyle = INK; c.lineWidth = LW; c.stroke();
      dot(c, 0, -.12, .33, '#7cc6e6'); c.strokeStyle = '#fff'; c.lineWidth = .05; c.beginPath(); c.arc(0, -.12, .2, .3, 2.2); c.stroke(); } },
  { name: '床墊', parts: [box(2.5, .5)], dens: .25, rest: .5, fric: .6, mat: 'soft', color: '#f6d6e6',
    deco: c => { c.strokeStyle = '#e9b9d1'; c.lineWidth = .05; for (let x = -1.125; x < 1.2; x += .25) line(c, x, -.25, x, .25);
      for (let x = -1; x <= 1; x += .5) dot(c, x, 0, .05, '#c98aa8'); } },
  { name: '魚缸', parts: [box(1.4, .95)], dens: 1.1, rest: .2, fric: .35, mat: 'glass', color: '#d6f0f5',
    deco: c => { c.fillStyle = '#7cc6e6'; c.fillRect(-.7, -.4, 1.4, .68);
      for (let i = 0; i < 7; i++) dot(c, -.6 + i * .2, -.4, .07, i % 2 ? '#c9b48a' : '#a9957a');
      c.beginPath(); c.ellipse(.1, -.04, .16, .09, 0, 0, 7); c.fillStyle = '#ff8a2b'; c.fill();
      c.beginPath(); c.moveTo(.25, -.04); c.lineTo(.38, .05); c.lineTo(.38, -.13); c.fill(); dot(c, .02, -.02, .02, INK);
      c.fillStyle = '#4a4a55'; c.fillRect(-.7, .4, 1.4, .08); c.fillRect(-.7, -.48, 1.4, .08); } },
  { name: '游泳圈', parts: [circ(.6)], dens: .3, rest: .5, fric: .75, mat: 'soft', color: '#ff6b6b',
    deco: c => { c.fillStyle = '#fffaf0'; for (let i = 0; i < 4; i++) { const a = i * Math.PI / 2; c.beginPath(); c.arc(0, 0, .6, a, a + .7); c.arc(0, 0, .28, a + .7, a, true); c.fill(); }
      dot(c, 0, 0, .28, '#b8e3f0'); c.strokeStyle = INK; c.lineWidth = LW; c.beginPath(); c.arc(0, 0, .28, 0, 7); c.stroke(); } },
  { name: '椅子', parts: [box(1.2, .18), box(.18, 1.0, -.51, .59), box(.14, .62, -.51, -.4), box(.14, .62, .51, -.4)], dens: .5, rest: .3, fric: .7, mat: 'wood', color: '#e0b04a',
    deco: c => { c.strokeStyle = '#b8862a'; c.lineWidth = .04; for (const y of [.4, .7, .95]) line(c, -.6, y, -.42, y); } },
  { name: '三角錐', parts: [trap(.9, .2, 1.1)], dens: .75, rest: .25, fric: .25, mat: 'plastic', color: '#ff8a2b',
    deco: c => { c.fillStyle = '#fffaf0'; c.fillRect(-.5, -.05, 1, .18); c.fillRect(-.5, .3, 1, .1); c.fillStyle = '#5a5a5a'; c.fillRect(-.5, -.55, 1, .12); } },
  { name: '洗衣袋', parts: [poly([[-.55,-.5],[.5,-.52],[.62,0],[.3,.5],[-.25,.55],[-.62,.05]])], dens: .2, rest: .15, fric: .4, mat: 'bag', color: '#8db86b',
    deco: c => { c.strokeStyle = 'rgba(45,42,50,.35)'; c.lineWidth = .035; line(c, -.2, .4, -.35, -.3); line(c, .15, .4, .3, -.2); },
    over: c => { c.save(); c.translate(.32, .5); c.rotate(-.5); c.fillStyle = '#fffaf0'; c.strokeStyle = INK; c.lineWidth = LW;
      c.fillRect(-.07, 0, .14, .3); c.strokeRect(-.07, 0, .14, .3); c.fillStyle = '#e85d75'; c.fillRect(-.07, .2, .14, .05); c.restore();
      dot(c, 0, .55, .07, '#6f9a52'); } },
];

// 算出每種物品的外框大小（給選單縮圖、厚度、鏡頭用）
for (const t of TYPES) {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  const add = (x, y) => { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); };
  for (const p of t.parts) {
    if (p.box) { const [hx, hy, cx, cy] = p.box; add(cx - hx, cy - hy); add(cx + hx, cy + hy); }
    else if (p.poly) p.poly.forEach(([x, y]) => add(x, y));
    else { add(-p.circle, -p.circle); add(p.circle, p.circle); }
  }
  t.bb = { w: x1 - x0, h: y1 - y0, cx: (x0 + x1) / 2, cy: (y0 + y1) / 2, r: Math.max(x1 - x0, y1 - y0) / 2 };
}

const FURS = [
  { fur: '#f4a259', mark: '#d9823a' },
  { fur: '#a3adb8', mark: '#7d8792' },
  { fur: '#3b3740', mark: '#2a272e', dark: true },
  { fur: '#fff6ea', mark: '#f4a259', patch: '#3b3740' },
  { fur: '#eadac0', mark: '#6b4b3a', point: true },
];

// ================= 3. 遊戲狀態 =================
let world, bodies = [];
let drag = null;              // 正在吊著的東西 { b, ox, oy, tx, ty, pid }
let pan = null;               // 拖曳畫面捲動
let stage = 1, score = 0, best = loadBest();
let status = 'intro';         // intro / play / measureWait / measure / stage / gameOverWait / gameOver / view
let wait = 0, helpStep = 1, frameN = 0, scoreGained = false;
let camBottom = CAM_MIN, S = 60, topAll = 0;
let menuItems = [], towerSnap = null, xMark = null;
let drops = [], ripples = [], fish = null, nextFish = 400;
const chain = { x: 0, y: 30 };

function loadBest() { try { return parseFloat(localStorage.getItem('catTowerBest2')) || 0; } catch { return 0; } }
function saveBest(v) { try { localStorage.setItem('catTowerBest2', String(v)); } catch {} }

function newWorld() {
  world = new pl.World({ gravity: V(0, GRAVITY), allowSleep: false });
  const plat = world.createBody({ type: 'static', position: V(0, PLAT_TOP - 1.5) });
  plat.createFixture({ shape: new pl.Box(PLAT_HW, 1.5), density: 1, friction: .6, restitution: .1 });
  bodies = [];
  world.on('begin-contact', onContact);
}

function makeBody(ti, x, y, angle, extra) {
  const t = TYPES[ti];
  const b = world.createBody({ type: 'kinematic', position: V(x, y), angle });
  for (const p of t.parts) {
    let shape;
    if (p.box) { const [hx, hy, cx, cy] = p.box; shape = (cx || cy) ? new pl.Box(hx, hy, V(cx, cy), 0) : new pl.Box(hx, hy); }
    else if (p.poly) shape = new pl.Polygon(p.poly.map(([a, c]) => V(a, c)));
    else shape = new pl.Circle(p.circle);
    b.createFixture({ shape, density: t.dens, friction: t.fric, restitution: t.rest });
  }
  b.setUserData({ ti, thick: Math.min(t.bb.w, t.bb.h) / 2, scale: .5, wet: false, cd: 0, pose: 'idle', deb: 40, fur: 0, ...extra });
  bodies.push(b);
  return b;
}

// ================= 4. 一局 / 一關 =================
function initGame() {
  newWorld();
  stage = 1; score = 0; scoreGained = false; status = 'play'; wait = 0;
  camBottom = CAM_MIN; towerSnap = null; xMark = null; drag = null; pan = null;
  drops = []; ripples = [];
  $('intro').classList.remove('on'); $('result').classList.remove('on');
  if (helpStep < 5) { helpStep = 1; showHelp('從上面拖一樣東西到木台上'); }
  initStage();
}

// 每關：4 個隨機雜物 + 1 隻貓。保證有一塊長板子；前幾關一定有一個怪東西。
// 第 6 關起只給 3 個雜物；預設的歪斜角度隨關卡越來越大。
function initStage() {
  const r = n => Math.floor(Math.random() * n);
  const items = [1 + r(6), 1 + r(6), 1 + r(6), 1 + r(6), 0];
  items[r(4)] = 1 + r(2);
  if (stage <= 5) items[r(4)] = 7 + r(8);
  else if (stage <= 7) items[r(4)] = 7 + r(3);
  menuItems = items.map((ti, i) => ({
    ti, rot: 2 * stage * Math.random() * (Math.random() < .5 ? -1 : 1),
    fur: r(FURS.length), done: stage >= 6 && i === 0,
  }));
  buildMenu();
  $('menu').classList.add('on');
  $('stageChip').textContent = `第 ${stage} 關`;
}

function buildMenu() {
  const m = $('menu');
  m.innerHTML = '';
  for (const mi of menuItems) {
    const el = document.createElement('div');
    el.className = 'slot' + (mi.ti === 0 ? ' cat' : '') + (mi.done ? ' done' : '');
    el.title = TYPES[mi.ti].name;
    const cv = document.createElement('canvas');
    const dpr = devicePixelRatio || 1;
    cv.width = cv.height = 56 * dpr;
    const c = cv.getContext('2d');
    const t = TYPES[mi.ti];
    const fit = Math.min(.5 * S, 48 / (t.bb.r * 2.1));
    c.setTransform(dpr, 0, 0, dpr, 28 * dpr, 28 * dpr);
    c.scale(fit, -fit); c.rotate(mi.rot * Math.PI / 180); c.translate(-t.bb.cx, -t.bb.cy);
    drawItem(c, mi.ti, { fur: mi.fur, pose: 'idle' }, 0);
    el.append(cv);
    el.addEventListener('pointerdown', e => grabFromMenu(e, el, mi));
    m.append(el);
  }
}

function showHelp(text) { $('help').textContent = text; $('help').classList.add('on'); }
function hideHelp() { $('help').classList.remove('on'); }

// ================= 5. 吊起 / 放下 =================
function toWorld(sx, sy) { return { x: (sx - innerWidth / 2) / S, y: camBottom + (innerHeight - sy) / S }; }

function grabFromMenu(e, el, mi) {
  e.preventDefault();
  if (drag || status !== 'play' || mi.done) return;
  try { el.releasePointerCapture(e.pointerId); } catch {}
  const r = el.getBoundingClientRect();
  const w = toWorld(r.left + r.width / 2, r.top + r.height / 2);
  const pw = toWorld(e.clientX, e.clientY);
  const t = TYPES[mi.ti];
  const b = makeBody(mi.ti, w.x, w.y, mi.rot * Math.PI / 180, { fur: mi.fur, pose: 'down' });
  // 手機上把東西提高一點，才不會被手指擋住
  const lift = e.pointerType === 'touch' ? t.bb.h / 2 + .5 : 0;
  drag = { b, ox: w.x - pw.x, oy: w.y - pw.y + lift, pid: e.pointerId, tx: w.x, ty: w.y };
  setDragTarget(e.clientX, e.clientY);
  mi.done = true;
  el.classList.add('done');
  $('menu').classList.remove('on');
  playThud(t.mat, .6);
  hideHelp();
  if (helpStep === 1) helpStep = 2;
}

function setDragTarget(sx, sy) {
  const w = toWorld(sx, sy);
  const u = drag.b.getUserData();
  const maxX = innerWidth / 2 / S;
  drag.tx = Math.max(-maxX, Math.min(maxX, w.x + drag.ox));
  drag.ty = Math.max(PLAT_TOP + u.thick, w.y + drag.oy);   // 不能吊到比木台還低
}

function releaseDrag() {
  const b = drag.b;
  drag = null;
  b.setDynamic();                       // 放手：交給物理引擎
  b.setLinearVelocity(V(0, 0));
  b.setAngularVelocity(0);
  b.setAwake(true);
  b.getUserData().pose = 'idle';
  sfx.drop();
  const left = menuItems.filter(m => !m.done);
  if (!left.length) { status = 'measureWait'; wait = 50; return; }
  $('menu').classList.add('on');
  if (helpStep === 2) { showHelp('把其他雜物也疊上去'); helpStep = 3; }
  else if (helpStep === 3 && left.length === 1 && left[0].ti === 0) { showHelp('最後放上貓咪，量量牠有多高！'); helpStep = 4; }
}

// ================= 6. 輸入 =================
const canvas = $('game');
canvas.addEventListener('pointerdown', e => {
  if (drag || pan) return;
  if (['play', 'measureWait', 'measure'].includes(status)) pan = { pid: e.pointerId, y: e.clientY, cam: camBottom };
});
addEventListener('pointermove', e => {
  if (drag && e.pointerId === drag.pid) setDragTarget(e.clientX, e.clientY);
  else if (pan && e.pointerId === pan.pid) camBottom = clampCam(pan.cam + (e.clientY - pan.y) / S);
});
const endPointer = e => {
  if (drag && e.pointerId === drag.pid) releaseDrag();
  if (pan && e.pointerId === pan.pid) pan = null;
};
addEventListener('pointerup', endPointer);
addEventListener('pointercancel', endPointer);
addEventListener('wheel', e => {
  if (['play', 'measureWait', 'measure'].includes(status)) camBottom = clampCam(camBottom - e.deltaY / S * .6);
}, { passive: true });
function clampCam(v) { return Math.max(CAM_MIN, Math.min(v, Math.max(CAM_MIN, topAll - 1.5))); }

$('startBtn').onclick = () => { audioInit(); sfx.button(); initGame(); };
$('againBtn').onclick = () => { sfx.button(); initGame(); };
$('viewBtn').onclick = () => { if (!towerSnap) return; sfx.button(); status = 'view'; $('result').classList.remove('on'); $('closeView').style.display = 'block'; };
$('closeView').onclick = () => { sfx.button(); status = 'gameOver'; $('closeView').style.display = 'none'; $('result').classList.add('on'); };
$('soundBtn').onclick = () => { soundOn = !soundOn; $('soundBtn').textContent = soundOn ? '聲音：開' : '聲音：關'; if (master) master.gain.value = soundOn ? 1 : 0; };

// ================= 7. 每一格的遊戲規則 =================
function step() {
  frameN++;
  if (!world || status === 'intro' || status === 'view') return;

  // 吊著的東西用「速度」追手指，這樣推到別的東西時物理比較自然
  if (drag) {
    const p = drag.b.getPosition();
    let vx = (drag.tx - p.x) * 60, vy = (drag.ty - p.y) * 60;
    const L = Math.hypot(vx, vy), M = 30;
    if (L > M) { vx *= M / L; vy *= M / L; }
    drag.b.setLinearVelocity(V(vx, vy));
    drag.b.setAngularVelocity(0);
  }
  world.step(1 / 60);

  let topCat = null, topY = -999;
  topAll = PLAT_TOP;
  for (const b of bodies) {
    const u = b.getUserData(), p = b.getPosition();
    if (u.cd > 0) u.cd--;
    if (u.scale < 1) u.scale = Math.min(1, u.scale + .1);
    topAll = Math.max(topAll, p.y + TYPES[u.ti].bb.r);

    // 碰到水 → 濺水花、慢慢沉下去、遊戲結束
    if (p.y < WATER + u.thick) {
      const v = b.getLinearVelocity();
      if (!u.wet) { u.wet = true; makeSplash(p.x, Math.min(1.5, .4 - v.y * Math.sqrt(b.getMass()) / 10)); }
      b.setLinearVelocity(V(v.x * .8, Math.max(v.y * .8, -.5)));
      b.setAngularVelocity(b.getAngularVelocity() * .85);
      if (p.y < -3.5) b.setTransform(V(p.x, -3.5), b.getAngle());
      if (status !== 'gameOverWait' && status !== 'gameOver') startGameOver(p.x);
    }
    if (u.ti === 0 && !(drag && drag.b === b) && p.y > topY) { topY = p.y; topCat = b; }
  }
  updateCats();
  updateChain();

  if (status === 'measureWait') {
    // 等最高那隻貓停下來（還在往下掉就等久一點）
    wait -= topCat && topCat.getLinearVelocity().y > -.01 ? 1 : .1;
    if (wait <= 0) { status = 'measure'; scoreGained = false; }
  } else if (status === 'measure') {
    // 分數只會往上加：最高的貓比目前紀錄高，就一格一格量上去
    const h = topCat ? topY - PLAT_TOP : 0;
    if (h > score + .005) {
      const still = topCat.getLinearVelocity().y > -.01;
      score = Math.min(h, score + (still ? .02 : .01));
      scoreGained = true;
      if (frameN % 4 === 0) sfx.tick();
    } else {
      if (scoreGained || !towerSnap) towerSnap = snapshot();
      sfx.level();
      status = 'stage'; wait = 100; stage++;
      $('banner').textContent = `第 ${stage} 關`; $('banner').classList.add('on');
    }
  } else if (status === 'stage') {
    const target = Math.max(CAM_MIN, topAll + 3.2 + 160 / S - innerHeight / S);
    camBottom += (target - camBottom) * .05;
    if (--wait <= 0) {
      $('banner').classList.remove('on');
      status = 'play';
      initStage();
      if (helpStep >= 3 && helpStep < 5) { showHelp('繼續往上蓋！可以上下拖曳畫面'); helpStep = 5; }
    }
  } else if (status === 'gameOverWait') {
    camBottom += (CAM_MIN - camBottom) * .1;
    if (--wait <= 0) gameOver();
  }

  // 高塔在晃的時候會嘎吱響
  if (status === 'play' && score > 6 && topCat && frameN % 90 === 0 && Math.abs(topCat.getLinearVelocity().x) > .03) sfx.creak();
  ambient();
  updateHud();
}

function startGameOver(x) {
  status = 'gameOverWait'; wait = 60; xMark = { x };
  hideHelp(); $('menu').classList.remove('on'); $('banner').classList.remove('on');
  if (drag) { drag.b.setDynamic(); drag = null; }
}

function gameOver() {
  status = 'gameOver';
  score = Math.round(score * 100) / 100;
  const isBest = score > best;
  if (isBest) { best = score; saveBest(best); }
  const rating = score <= 0 ? 0 : score < 4 ? 1 : score < 8 ? 2 : score < 12 ? 3 : score < 16 ? 4 : 5;
  $('resHeight').textContent = score.toFixed(2) + ' m';
  $('resStars').textContent = '★'.repeat(rating) + '☆'.repeat(5 - rating);
  $('resRating').textContent = ['貓咪掉進水裡了…', '小土丘等級', '樹屋等級', '公寓大樓等級', '摩天大樓等級', '雲端貓宮殿！'][rating];
  $('resBest').textContent = isBest && score > 0 ? '新紀錄！' : `你的最佳：${best.toFixed(2)} m`;
  $('resBest').className = isBest && score > 0 ? 'new' : '';
  $('viewBtn').style.display = towerSnap ? '' : 'none';
  if (score > 0) sfx.gameOver(); else sfx.meow(.4);
  if (isBest && score > 0) setTimeout(sfx.highScore, 900);
  setTimeout(() => { if (status === 'gameOver') $('result').classList.add('on'); }, 1000);
}

function snapshot() {
  return bodies.map(b => { const u = b.getUserData(), p = b.getPosition();
    return { ti: u.ti, x: p.x, y: p.y, a: b.getAngle(), u: { fur: u.fur, pose: 'idle', scale: 1 } }; });
}

function updateHud() {
  $('score').firstChild.textContent = score.toFixed(2) + ' m';
  $('bestLine').textContent = '最佳 ' + best.toFixed(2) + ' m';
}

// 貓咪的表情：被晃到會嚇到、會看著你吊著的東西、沒事會東張西望
function updateCats() {
  for (const b of bodies) {
    const u = b.getUserData();
    if (u.ti !== 0 || (drag && drag.b === b)) continue;
    const v = b.getLinearVelocity(), p = b.getPosition();
    const a = Math.abs(Math.atan2(Math.sin(b.getAngle()), Math.cos(b.getAngle())));
    if (2 * Math.abs(v.x) + Math.abs(v.y) > 5 || p.y < PLAT_TOP + .2) {
      if (u.pose !== 'scared' && status !== 'gameOver') sfx.meow(.25);
      u.pose = 'scared'; u.deb = 30;
    } else if (drag && a < Math.PI / 4) {
      const dp = drag.b.getPosition();
      const dx = 1.5 * (dp.x - p.x), dy = dp.y - p.y;
      let pose = Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 'left' : 'right') : (dy > 0 ? 'up' : 'down');
      if (pose === 'down' && Math.abs(dy) < 1.5) pose = 'idle';
      u.pose = pose;
    } else if (u.deb > 0 && u.pose !== 'scared') {
      u.deb--;
    } else {
      u.deb = 60 + Math.floor(100 * Math.random());
      if ((status === 'gameOver' || status === 'gameOverWait') && a < Math.PI / 4) u.pose = 'up';
      else u.pose = u.pose !== 'idle' ? 'idle' : ['idle', 'left', 'right', 'up', 'sleepy'][Math.floor(Math.random() * 5)];
    }
  }
}

function updateChain() {
  if (drag) { const p = drag.b.getPosition(); chain.x = p.x; chain.y = p.y; }
  else { chain.x *= .9; chain.y += (camBottom + innerHeight / S + 1 - chain.y) * .1; }
}

// ================= 8. 水花、小魚 =================
function makeSplash(x, power) {
  for (let i = 0; i < 10 + power * 12; i++)
    drops.push({ x: x + (Math.random() - .5) * .6, y: WATER, vx: (Math.random() - .5) * 4 * power, vy: 2 + Math.random() * 5 * power, r: .04 + Math.random() * .06 });
  ripples.push({ x, t: 0, s: .6 + power });
  if (status !== 'gameOver') sfx.splash(power);
}
function onContact(contact) {
  const bA = contact.getFixtureA().getBody(), bB = contact.getFixtureB().getBody();
  const va = bA.getLinearVelocity(), vb = bB.getLinearVelocity();
  const dv = Math.hypot(va.x - vb.x, va.y - vb.y);
  if (dv < 1.5) return;
  for (const b of [bA, bB]) {
    const u = b.getUserData();
    if (u && u.cd <= 0) { u.cd = 12; playThud(TYPES[u.ti].mat, Math.min(1, dv / 7)); }
  }
}
function ambient() {
  for (const d of drops) { d.vy += GRAVITY * .4 / 60; d.x += d.vx / 60; d.y += d.vy / 60; }
  drops = drops.filter(d => d.y > WATER - .05);
  for (const r of ripples) r.t++;
  ripples = ripples.filter(r => r.t < 90);
  if (fish) { fish.t++; if (fish.t === 54) { ripples.push({ x: fish.x0 + fish.dir * 1.1, t: 0, s: .5 }); sfx.plop(); } if (fish.t > 60) fish = null; }
  else if (--nextFish <= 0) {
    const side = Math.random() < .5 ? -1 : 1;
    fish = { x0: side * (2.4 + Math.random() * 1.6), dir: -side * (Math.random() < .5 ? 1 : -.6), t: 0 };
    ripples.push({ x: fish.x0, t: 0, s: .5 }); sfx.plop();
    nextFish = 500 + Math.random() * 500;
  }
  if (frameN % 300 === 0 && Math.random() < .5 && status !== 'gameOver') sfx.chirp();
  audioAmbience();
}

// ================= 9. 畫面 =================
const ctx = canvas.getContext('2d');
const FONT = getComputedStyle(document.documentElement).getPropertyValue('--font');
const CLOUDS = Array.from({ length: 40 }, (_, i) => ({ x: Math.random() * 18 - 9, y: 2 + i * 1.9 + Math.random() * 1.5, w: .6 + Math.random() * .8, sp: .05 + Math.random() * .15 }));
const STARS = Array.from({ length: 90 }, () => ({ x: Math.random(), y: Math.random(), r: Math.random() * 1.4 + .3 }));
const SKY = [[0, [159, 214, 238], [230, 245, 240]], [15, [110, 168, 230], [191, 224, 245]], [35, [42, 63, 128], [111, 143, 208]], [60, [13, 20, 51], [42, 63, 128]]];

function skyAt(alt) {
  let i = 0; while (i < SKY.length - 2 && alt > SKY[i + 1][0]) i++;
  const [a0, t0, b0] = SKY[i], [a1, t1, b1] = SKY[i + 1];
  const k = Math.max(0, Math.min(1, (alt - a0) / (a1 - a0)));
  const mix = (p, q) => `rgb(${p.map((v, j) => Math.round(v + (q[j] - v) * k)).join(',')})`;
  return [mix(t0, t1), mix(b0, b1)];
}

function drawItem(c, ti, u, time) {
  const t = TYPES[ti];
  if (ti === 0) { drawCat(c, u, time); return; }
  c.lineJoin = 'round'; c.lineCap = 'round';
  partsPath(c, t); c.fillStyle = t.color; c.fill();
  c.save(); partsPath(c, t); c.clip(); t.deco && t.deco(c); c.restore();
  partsPath(c, t); c.lineWidth = LW; c.strokeStyle = INK; c.stroke();
  t.over && t.over(c);
}
function partsPath(c, t) {
  c.beginPath();
  for (const p of t.parts) {
    if (p.box) { const [hx, hy, cx, cy] = p.box; c.rect(cx - hx, cy - hy, hx * 2, hy * 2); }
    else if (p.poly) { p.poly.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y)); c.closePath(); }
    else { c.moveTo(p.circle, 0); c.arc(0, 0, p.circle, 0, Math.PI * 2); }
  }
}
function roundRect(c, x, y, w, h, r) {
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}

function drawCat(c, u, time) {
  const f = FURS[u.fur || 0], pose = u.pose || 'idle';
  c.lineJoin = 'round'; c.lineCap = 'round'; c.strokeStyle = INK; c.lineWidth = LW;
  // 尾巴
  c.beginPath(); c.moveTo(.45, -.2); c.bezierCurveTo(.95, -.25, .95, .3 + .08 * Math.sin(time / 300), .68, .42);
  c.lineWidth = .2; c.stroke(); c.lineWidth = .11; c.strokeStyle = f.point ? f.mark : f.fur; c.stroke();
  c.strokeStyle = INK; c.lineWidth = LW;
  // 耳朵（嚇到會往後壓）
  const flat = pose === 'scared' ? .14 : 0;
  for (const s of [-1, 1]) {
    c.beginPath(); c.moveTo(s * .46, .18); c.lineTo(s * (.44 + flat), .58 - flat * 1.4); c.lineTo(s * .14, .3); c.closePath();
    c.fillStyle = f.point ? f.mark : (f.patch && s < 0 ? f.patch : f.fur); c.fill(); c.stroke();
    c.beginPath(); c.moveTo(s * .4, .24); c.lineTo(s * (.4 + flat * .8), .46 - flat); c.lineTo(s * .24, .3); c.closePath(); c.fillStyle = '#f4a6b4'; c.fill();
  }
  // 身體
  roundRect(c, -.6, -.33, 1.2, .66, .26); c.fillStyle = f.fur; c.fill();
  c.save(); c.clip();
  if (f.patch) { dot(c, -.35, .22, .28, f.patch); dot(c, .4, -.25, .22, f.mark); }
  else if (f.point) { c.beginPath(); c.ellipse(0, -.02, .32, .24, 0, 0, 7); c.fillStyle = f.mark; c.fill(); }
  else { c.strokeStyle = f.mark; c.lineWidth = .06; for (const x of [-.08, 0, .08]) line(c, x, .33, x, .2); line(c, -.6, -.05, -.45, -.08); line(c, .6, -.05, .45, -.08); }
  c.restore();
  roundRect(c, -.6, -.33, 1.2, .66, .26); c.strokeStyle = INK; c.lineWidth = LW; c.stroke();
  // 前腳
  for (const s of [-1, 1]) { c.beginPath(); c.ellipse(s * .2, -.3, .12, .07, 0, 0, 7); c.fillStyle = f.dark ? '#4a4550' : '#fffaf0'; c.fill(); c.stroke(); }
  // 臉
  const look = { left: [-.07, 0], right: [.07, 0], up: [0, .06], down: [0, -.05] }[pose] || [0, 0];
  const faceInk = f.dark ? '#f5d142' : INK;
  if (pose === 'scared') {
    for (const s of [-1, 1]) { dot(c, s * .2, .05, .1, '#fff'); c.beginPath(); c.arc(s * .2, .05, .1, 0, 7); c.stroke(); dot(c, s * .2, .05, .035, INK); }
    dot(c, 0, -.14, .05, INK);
  } else if (pose === 'sleepy') {
    c.strokeStyle = faceInk; c.lineWidth = .04;
    for (const s of [-1, 1]) { c.beginPath(); c.arc(s * .2, .06, .06, Math.PI * 1.1, Math.PI * 1.9, true); c.stroke(); }
  } else {
    for (const s of [-1, 1]) {
      c.beginPath(); c.ellipse(s * .2 + look[0], .05 + look[1], .055, .075, 0, 0, 7); c.fillStyle = faceInk; c.fill();
      if (f.dark) { c.beginPath(); c.ellipse(s * .2 + look[0], .05 + look[1], .015, .06, 0, 0, 7); c.fillStyle = INK; c.fill(); }
      dot(c, s * .2 + look[0] + .02, .08 + look[1], .018, '#fff');
    }
  }
  if (pose !== 'scared') {
    c.beginPath(); c.moveTo(-.04, -.04); c.lineTo(.04, -.04); c.lineTo(0, -.08); c.closePath(); c.fillStyle = '#f48aa0'; c.fill();
    c.strokeStyle = faceInk; c.lineWidth = .03;
    c.beginPath(); c.arc(-.04, -.09, .04, 0, Math.PI); c.stroke(); c.beginPath(); c.arc(.04, -.09, .04, 0, Math.PI); c.stroke();
  }
  c.strokeStyle = f.dark ? 'rgba(255,255,255,.6)' : 'rgba(45,42,50,.55)'; c.lineWidth = .02;
  for (const s of [-1, 1]) for (const dy of [-.04, -.1]) line(c, s * .12, dy, s * .4, dy + (dy + .07) * .6);
  c.globalAlpha = .35; dot(c, -.33, -.06, .06, '#ff7a8a'); dot(c, .33, -.06, .06, '#ff7a8a'); c.globalAlpha = 1;
}

function render(time) {
  const dpr = devicePixelRatio || 1, W = innerWidth, H = innerHeight;
  if (canvas.width !== Math.round(W * dpr) || canvas.height !== Math.round(H * dpr)) { canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr); }
  let items, s, cam;
  if (status === 'view' && towerSnap) {
    const top = Math.max(...towerSnap.map(r => r.y + TYPES[r.ti].bb.r), 1) + 1.2;
    s = Math.min(H / (top - CAM_MIN), W / 6.2); cam = CAM_MIN; items = towerSnap;
  } else {
    S = Math.min(H / 9.5, W / 6.2); s = S; cam = camBottom;
    items = bodies.map(b => { const u = b.getUserData(), p = b.getPosition(); return { ti: u.ti, x: p.x, y: p.y, a: b.getAngle(), u, held: drag && drag.b === b }; });
  }
  const X = x => W / 2 + x * s, Y = y => H - (y - cam) * s;
  const alt = cam + H / s / 2;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // 天空（越高顏色越深，最後看得到星星）
  const [top, bot] = skyAt(alt);
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, top); g.addColorStop(1, bot);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  if (alt > 25) {
    ctx.fillStyle = `rgba(255,255,255,${Math.min(1, (alt - 25) / 20)})`;
    for (const st of STARS) { ctx.beginPath(); ctx.arc(st.x * W, ((st.y * H + cam * s * .05) % H + H) % H, st.r, 0, 7); ctx.fill(); }
  }
  // 遠山（視差：鏡頭往上時，山往下沉得比較慢）
  for (const [k, hgt, col, seed] of [[.35, 2.6, '#a9d0d6', 1.3], [.5, 1.6, '#86bcb4', 4.1]]) {
    const base = H - (WATER - CAM_MIN - (cam - CAM_MIN) * k) * s;
    if (base - hgt * s > H) continue;
    ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= W + 8; x += 8) { const wx = (x - W / 2) / s; ctx.lineTo(x, base - hgt * s * (.55 + .25 * Math.sin(wx * .7 + seed) + .2 * Math.sin(wx * 1.9 + seed * 2))); }
    ctx.lineTo(W, H); ctx.fillStyle = col; ctx.fill();
  }
  // 雲
  ctx.fillStyle = 'rgba(255,255,255,.9)';
  for (const cl of CLOUDS) {
    const cx = W / 2 + ((((cl.x + time / 1000 * cl.sp) + 9) % 18 + 18) % 18 - 9) * s;
    const cy = H - (cl.y - CAM_MIN - (cam - CAM_MIN) * .8) * s;
    if (cy < -s || cy > H + s) continue;
    for (const [dx, dy, r] of [[-.5, 0, .35], [0, .15, .5], [.5, 0, .38], [0, -.1, .4]]) { ctx.beginPath(); ctx.arc(cx + dx * cl.w * s, cy - dy * cl.w * s, r * cl.w * s, 0, 7); ctx.fill(); }
  }

  // 池塘（後層）
  const wy = Y(WATER);
  if (wy < H) {
    const wg = ctx.createLinearGradient(0, wy, 0, wy + 3 * s); wg.addColorStop(0, '#5fb3cf'); wg.addColorStop(1, '#2f7ea3');
    ctx.fillStyle = wg; ctx.fillRect(0, wy, W, H - wy);
  }
  // 蘆葦
  ctx.lineCap = 'round';
  for (const [rx, n] of [[-3.3, 5], [3.4, 6], [-4.6, 4]]) for (let i = 0; i < n; i++) {
    const x = rx + i * .12, h = .6 + ((i * 37) % 5) * .12, sway = Math.sin(time / 900 + i) * .05;
    ctx.strokeStyle = '#5f8f4a'; ctx.lineWidth = .05 * s; ctx.beginPath(); ctx.moveTo(X(x), Y(WATER - .2)); ctx.lineTo(X(x + sway), Y(WATER + h)); ctx.stroke();
    if (i % 2 === 0) { ctx.fillStyle = '#8a5a2e'; ctx.beginPath(); ctx.ellipse(X(x + sway), Y(WATER + h - .1), .05 * s, .14 * s, 0, 0, 7); ctx.fill(); }
  }
  // 木台（樁子 + 甲板）
  ctx.lineWidth = 3; ctx.strokeStyle = INK;
  for (const px of [-1.45, 0, 1.45]) { ctx.fillStyle = '#7d5129'; ctx.fillRect(X(px - .12), Y(-.3), .24 * s, 3 * s); ctx.strokeRect(X(px - .12), Y(-.3), .24 * s, 3 * s); }
  ctx.fillStyle = '#b07a42'; ctx.fillRect(X(-PLAT_HW), Y(PLAT_TOP), PLAT_HW * 2 * s, .32 * s);
  ctx.fillStyle = '#c9955b'; ctx.fillRect(X(-PLAT_HW), Y(PLAT_TOP), PLAT_HW * 2 * s, .08 * s);
  ctx.strokeStyle = 'rgba(45,42,50,.35)'; ctx.lineWidth = 2;
  for (let x = -PLAT_HW + .35; x < PLAT_HW; x += .35) { ctx.beginPath(); ctx.moveTo(X(x), Y(PLAT_TOP)); ctx.lineTo(X(x), Y(PLAT_TOP - .32)); ctx.stroke(); }
  ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.strokeRect(X(-PLAT_HW), Y(PLAT_TOP), PLAT_HW * 2 * s, .32 * s);

  // 尺規（左邊的公尺刻度）
  ctx.font = '700 12px ' + FONT; ctx.textBaseline = 'middle';
  for (let m = 1; Y(PLAT_TOP + m) > 0; m++) {
    const y = Y(PLAT_TOP + m); if (y > H) continue;
    ctx.fillStyle = 'rgba(45,42,50,.55)'; ctx.fillRect(0, y - 1, m % 5 ? 10 : 18, 2);
    ctx.fillText(m + ' m', 22, y);
  }
  // 吊繩
  if (status !== 'view') {
    ctx.strokeStyle = '#6b5a4a'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(X(chain.x), -10); ctx.lineTo(X(chain.x), Y(chain.y)); ctx.stroke();
  }

  // 物品
  const drawRec = r => {
    ctx.save(); ctx.translate(X(r.x), Y(r.y));
    const k = s * (r.u.scale || 1); ctx.scale(k, -k); ctx.rotate(r.a);
    drawItem(ctx, r.ti, r.u, time); ctx.restore();
  };
  items.filter(r => !r.held).forEach(drawRec);
  items.filter(r => r.held).forEach(drawRec);

  // 池塘（前層，蓋住沉下去的東西）
  if (wy < H + s) {
    ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= W + 8; x += 8) ctx.lineTo(x, Y(WATER + .04 * Math.sin((x - W / 2) / s * 2.2 + time / 450)));
    ctx.lineTo(W, H); ctx.closePath(); ctx.fillStyle = 'rgba(63,147,184,.62)'; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 2; ctx.stroke();
    for (const r of ripples) {
      ctx.strokeStyle = `rgba(255,255,255,${(1 - r.t / 90) * .8})`; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(X(r.x), wy, r.t / 90 * r.s * 1.2 * s + 2, r.t / 90 * r.s * .25 * s + 1, 0, 0, 7); ctx.stroke();
    }
    for (const [lx, lr] of [[-2.6, .32], [2.5, .4], [3.9, .28]]) {
      ctx.beginPath(); ctx.ellipse(X(lx), wy + 2 + Math.sin(time / 800 + lx) * 1.5, lr * s, lr * .3 * s, 0, .25, Math.PI * 2 - .1);
      ctx.lineTo(X(lx), wy + 2); ctx.closePath(); ctx.fillStyle = '#6fbf5a'; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.stroke();
    }
  }
  // 小魚跳出水面
  if (fish) {
    const k = fish.t / 54; if (k <= 1) {
      const fx = fish.x0 + fish.dir * 1.1 * k, fy = WATER + 1.1 * Math.sin(Math.PI * k);
      ctx.save(); ctx.translate(X(fx), Y(fy)); ctx.scale(Math.sign(fish.dir), 1); ctx.rotate(-Math.cos(Math.PI * k) * .9);
      ctx.fillStyle = '#ff8a2b'; ctx.strokeStyle = INK; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(0, 0, .2 * s, .1 * s, 0, 0, 7); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-.18 * s, 0); ctx.lineTo(-.32 * s, -.09 * s); ctx.lineTo(-.32 * s, .09 * s); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore();
    }
  }
  ctx.fillStyle = '#bfe6f5'; for (const d of drops) { ctx.beginPath(); ctx.arc(X(d.x), Y(d.y), d.r * s, 0, 7); ctx.fill(); }
  // 蜻蜓
  const dfx = 2.6 * Math.cos(time / 2600), dfy = 1.1 + .25 * Math.sin(time / 700) + .1 * Math.sin(time / 230);
  ctx.save(); ctx.translate(X(dfx), Y(dfy)); ctx.scale(Math.sin(time / 2600) > 0 ? -1 : 1, 1);
  ctx.strokeStyle = '#3d6fd1'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-.22 * s, 0); ctx.lineTo(.08 * s, 0); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.75)'; const fl = Math.sin(time / 25) * .5 + .5;
  for (const d of [-1, 1]) { ctx.beginPath(); ctx.ellipse(.02 * s, d * .07 * s * fl, .12 * s, .035 * s, d * .5, 0, 7); ctx.fill(); }
  ctx.restore();

  // 高度紀錄線（量高度時會一路往上爬）
  if (score > 0 && status !== 'intro') {
    const y = Y(PLAT_TOP + score), measuring = status === 'measure';
    ctx.setLineDash([8, 6]); ctx.strokeStyle = measuring ? '#ff7a59' : 'rgba(45,42,50,.45)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); ctx.setLineDash([]);
    const txt = score.toFixed(2) + ' m';
    ctx.font = `900 ${measuring ? 20 : 14}px ` + FONT;
    const tw = ctx.measureText(txt).width + 16, th = measuring ? 30 : 22, tx = W - tw - 12;
    roundRect(ctx, tx, y - th / 2, tw, th, 8); ctx.fillStyle = measuring ? '#ff7a59' : '#fffaf0'; ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.fillStyle = measuring ? '#fff' : INK; ctx.textBaseline = 'middle'; ctx.fillText(txt, tx + 8, y + 1);
  }
  if (xMark && status !== 'view') {
    const x = X(xMark.x), y = wy - 4, r = 12;
    ctx.strokeStyle = '#e8394d'; ctx.lineWidth = 6; line(ctx, x - r, y - r, x + r, y + r); line(ctx, x + r, y - r, x - r, y + r);
  }
}

// ================= 10. 音效（全部用 Web Audio 現場合成） =================
let AC = null, master = null, noiseBuf = null, soundOn = true, waterGain = null, windGain = null;
function audioInit() {
  if (AC) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = soundOn ? 1 : 0; master.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const loop = (type, f, q) => { const s = AC.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
      const fl = AC.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q;
      const g = AC.createGain(); g.gain.value = 0; s.connect(fl).connect(g).connect(master); s.start(); return g; };
    waterGain = loop('lowpass', 420, .7);
    windGain = loop('bandpass', 700, .4);
  } catch { AC = null; }
}
function audioAmbience() {
  if (!AC) return;
  const t = AC.currentTime, alt = Math.max(0, camBottom - CAM_MIN), on = status !== 'gameOver';
  waterGain.gain.setTargetAtTime(on ? Math.max(0, .05 - alt * .004) : 0, t, .5);
  windGain.gain.setTargetAtTime(on ? Math.min(.12, alt * .006) : 0, t, .5);
}
function env(g, t, peak, dur) { g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + .006); g.gain.exponentialRampToValueAtTime(.0001, t + dur); }
function tone(type, f1, f2, dur, vol, delay = 0) {
  if (!AC) return; const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  env(g, t, vol, dur); o.connect(g).connect(master); o.start(t); o.stop(t + dur + .05);
}
function noise(type, f1, f2, dur, vol, q = 1, delay = 0) {
  if (!AC) return; const t = AC.currentTime + delay, s = AC.createBufferSource(), fl = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; fl.type = type; fl.Q.value = q; fl.frequency.setValueAtTime(f1, t); fl.frequency.exponentialRampToValueAtTime(f2, t + dur);
  env(g, t, vol, dur); s.connect(fl).connect(g).connect(master); s.start(t, Math.random()); s.stop(t + dur + .05);
}
const MAT = {
  wood: v => { tone('triangle', 190, 70, .15, .35 * v); noise('lowpass', 900, 200, .08, .25 * v); },
  cardboard: v => noise('bandpass', 500, 250, .12, .5 * v, 1.5),
  metal: v => { tone('square', 620, 560, .25, .05 * v); tone('triangle', 930, 900, .35, .08 * v); },
  plastic: v => { tone('sine', 340, 180, .12, .3 * v); noise('highpass', 1500, 1500, .04, .1 * v); },
  ceramic: v => { tone('sine', 1250, 1150, .25, .15 * v); tone('sine', 2100, 2000, .15, .06 * v); },
  glass: v => { tone('sine', 1900, 1850, .35, .12 * v); tone('sine', 2850, 2800, .25, .06 * v); },
  soft: v => noise('lowpass', 400, 120, .12, .5 * v),
  bag: v => noise('bandpass', 900, 300, .15, .4 * v, .8),
  cat: v => tone('triangle', 200, 90, .12, .3 * v),
};
function playThud(mat, v) { if (AC && v > .02) MAT[mat](v); }
let lastMeow = 0;
const sfx = {
  button: () => tone('sine', 700, 500, .06, .12),
  drop: () => tone('sine', 300, 150, .08, .1),
  tick: () => tone('square', 1800, 1800, .02, .03),
  plop: () => tone('sine', 500, 1200, .08, .08),
  splash: p => { noise('lowpass', 3500, 250, .4 + .4 * p, Math.min(.7, .3 + .3 * p)); noise('bandpass', 1200, 400, .3, .2 * p, 2, .05); },
  level: () => [523, 659, 784, 1046].forEach((f, i) => tone('triangle', f, f, .25, .15, i * .09)),
  gameOver: () => [440, 349, 262].forEach((f, i) => tone('triangle', f, f * .98, .35, .18, i * .18)),
  highScore: () => [523, 659, 784, 1046, 1318].forEach((f, i) => tone('square', f, f, .2, .05, i * .08)),
  chirp: () => [0, .12, .24].forEach(d => tone('sine', 2600, 3600, .07, .04, d)),
  creak: () => tone('sawtooth', 95, 70, .6, .05),
  meow: (vol = .25) => {
    if (!AC || AC.currentTime - lastMeow < .4) return; lastMeow = AC.currentTime;
    const t = AC.currentTime, f0 = 480 + Math.random() * 220, o = AC.createOscillator(), fl = AC.createBiquadFilter(), g = AC.createGain();
    o.type = 'sawtooth'; o.frequency.setValueAtTime(f0 * .8, t); o.frequency.linearRampToValueAtTime(f0 * 1.25, t + .15); o.frequency.linearRampToValueAtTime(f0 * .7, t + .45);
    fl.type = 'lowpass'; fl.frequency.setValueAtTime(900, t); fl.frequency.linearRampToValueAtTime(2200, t + .15); fl.frequency.linearRampToValueAtTime(700, t + .45);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol * .4, t + .05); g.gain.exponentialRampToValueAtTime(.0001, t + .5);
    o.connect(fl).connect(g).connect(master); o.start(t); o.stop(t + .55);
  },
};

// ================= 11. 主迴圈 =================
let last = performance.now(), acc = 0;
function frame(t) {
  requestAnimationFrame(frame);
  acc += Math.min(t - last, 100); last = t;
  let n = 0;
  while (acc >= 1000 / 60 && n < 4) { step(); acc -= 1000 / 60; n++; }
  render(t);
}
$('introBest').textContent = best > 0 ? `你的最佳紀錄：${best.toFixed(2)} m` : '';
newWorld();
requestAnimationFrame(frame);
</script>
